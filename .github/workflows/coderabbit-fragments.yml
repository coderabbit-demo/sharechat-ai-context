name: CodeRabbit fragments

# Fails if a skill changed without regenerating its CodeRabbit check fragment.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-coderabbit-checks.mjs
      - name: Fragments are up to date
        run: git diff --exit-code -- coderabbit/ || (echo "Run: node scripts/generate-coderabbit-checks.mjs" && exit 1)
